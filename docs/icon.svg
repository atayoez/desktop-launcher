<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ec6ff"/>
      <stop offset="0.55" stop-color="#3b7dd8"/>
      <stop offset="1" stop-color="#1f3c88"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be38b"/>
      <stop offset="1" stop-color="#3f9d57"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- wallpaper -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <path d="M4 96 Q 40 70 70 92 T 124 84 L 124 98 Q 124 124 98 124 L 30 124 Q 4 124 4 98 Z" fill="url(#hill)" opacity="0.9"/>
  <!-- app tiles sitting on the wallpaper -->
  <g filter="url(#shadow)">
    <rect x="22" y="22" width="24" height="24" rx="7" fill="#fff" opacity="0.95"/>
    <rect x="52" y="22" width="24" height="24" rx="7" fill="#fff" opacity="0.95"/>
    <rect x="82" y="22" width="24" height="24" rx="7" fill="#fff" opacity="0.95"/>
    <rect x="22" y="52" width="24" height="24" rx="7" fill="#fff" opacity="0.95"/>
    <rect x="52" y="52" width="24" height="24" rx="7" fill="#fff" opacity="0.95"/>
    <rect x="82" y="52" width="24" height="24" rx="7" fill="#fff" opacity="0.95"/>
  </g>
  <!-- a folder tile: four dots -->
  <g fill="#3b7dd8">
    <circle cx="88" cy="58" r="3"/><circle cx="100" cy="58" r="3"/>
    <circle cx="88" cy="70" r="3"/><circle cx="100" cy="70" r="3"/>
  </g>
  <!-- cursor -->
  <path d="M60 58 L60 86 L67 79 L72 90 L77 88 L72 77 L81 77 Z" fill="#fff" stroke="#1f3c88" stroke-width="2.5" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
